name: Tau3Mu
channels:
  - conda-forge
  - pytorch
  # - nvidia
dependencies:
  - python=3.11.8
  - numpy
  - scipy
  - matplotlib
  - jupyter
  - tqdm
  - numba
  - vector
  - uproot
  - awkward
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - cpuonly  # if you want CPU only
  # - pytorch-cuda=11.8  # enables GPU support
  # - pyg -c pyg # available for Linux
  - networkx
  - pip:
    - torch_geometric