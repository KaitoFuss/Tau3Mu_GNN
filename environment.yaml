name: Tau3Mu
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11.8
  - numpy<2
  - scipy
  - matplotlib
  - jupyter
  - tqdm
  - numba
  - vector
  - uproot
  - awkward
  - pandas
  - pip
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - pytorch-cuda=11.8  # enables GPU support
  - networkx

  # do additionally 
  # conda install pyg -c pyg
  # conda install root
  # pip install comet_ml