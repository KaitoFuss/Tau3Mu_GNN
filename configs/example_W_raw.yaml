# Example user config (W channel), starting from RAW NanoAOD: stage 0 (resonance skim) runs.
# For resonance-skimmed inputs set already_resonance_skimmed: true. Copy this file and edit it.
# Frozen analysis settings live in analysis_defaults_W.yaml and must NOT be set here.

analysis_name: my_W_raw                    # letters, digits, _ - . only; used as folder name

channel: W                                 # selects configs/analysis_defaults_W.yaml

# Batch system: htcondor (default, lxplus). The paths below are lxplus paths.
# On the PSI T3: scheduler: slurm, with T3 paths (dCache output_base, log_dir on /work).
# scheduler: htcondor

paths:
  # All outputs go to <output_base>/<analysis_name>.
  # EOS user space ($USER_INITIAL = the first letter of $USER, e.g. /eos/user/k/kfuss).
  # Jobs write to their scratch folder first and then xrdcp to this location.
  output_base: root://eosuser.cern.ch//eos/user/$USER_INITIAL/$USER/tau3mu_pipeline/analysis
  # Folder on AFS for the job scripts and HTCondor logs (HTCondor cannot write its logs to EOS).
  # Logs are also copied next to the results (<phase>_vsN/logs/).
  log_dir: /afs/cern.ch/user/$USER_INITIAL/$USER/tau3mu_logs
  # Optional. Conda env that the jobs activate. Not set: the env that is active when you submit.
  # conda_env: /eos/user/$USER_INITIAL/$USER/envs/Tau3Mu

inputs:
  # Globs are allowed. A single path is also fine.
  # Riccardo's raw W NanoAOD (TauTo3Mu_*, PFCands_* branches, no Slimmed_*); copy of the T3 files
  # in the B-physics group space (jobs/migration/).
  signal:
    - /eos/cms/store/group/phys_bphys/kfuss/tau3mu_inputs/manzoni/tau3mu_gnn/WtoTauNu-Tauto3Mu_TuneCP5_13p6TeV_pythia8/05may25v2__WtoTauNu-Tauto3Mu_TuneCP5_13p6TeV_pythia8_RunIII2024Summer24MiniAOD-140X_mcRun3_2024_realistic_v26-v2_MINIAODSIM/250506_093818/*/*.root
  # All 8 ParkingDoubleMuonLowMass streams, Run2024B-I. Only the era folders (they start with "_"):
  # the 29apr2025 folders of streams 0-4 are older copies of eras B-E. The old skims used only
  # the era folders (checked: no event that is only in 29apr2025 is in the old skim).
  background:
    - /eos/cms/store/group/phys_bphys/kfuss/tau3mu_inputs/manzoni/tau3mu_gnn/ParkingDoubleMuonLowMass*/_ParkingDoubleMuonLowMass*_Run2024*/*/*/*.root
  tree_name: Events                        # optional, default: Events
  already_resonance_skimmed: false         # false: inputs are raw NanoAOD, stage 0 runs; true: skip stage 0

# Map from the analysis branch names (left) to the names in YOUR ntuples (right).
# Only list branches whose name differs. Leave empty if your names are the same.
# Raw NanoAOD (already_resonance_skimmed: false): use the raw names on the left (TauTo3Mu_*, PFCands_*).
branch_map: {}
#   TauTo3Mu_fitted_pt: Tau3Mu_fit_pt

# Optional. Which BDT and GNN to use. Default: frozen (the models in models/W/).
# Or the path of a finished training GNN phase (tau3mu-training): its BDT, GNN and the model settings
# (BDT preselection cut, graph type, conv type, ...) are then used instead of the frozen ones.
# models: root://eosuser.cern.ch//eos/user/$USER_INITIAL/$USER/tau3mu_pipeline/my_W_train/gnn_vs1

limit:
  # REQUIRED. Weight that scales the signal MC to your dataset (lumi, cross section, reference BR).
  # 0.000019 is not yet the physical value: it only scales the signal so that the limits have a
  # comparable size. Compute the real value for YOUR dataset.
  signal_weight: 0.000019
  # One cut or a list of cuts on the GNN score (the raw logit of the GNN). A list runs a cut scan.
  # Default: 3.5 (best cut of the frozen W model). Each cut must be > -1: GNN_score = -1 marks the events
  # below the BDT preselection cut, which the GNN does not score.
  gnn_score_cut: 3.5

benchmark:
  # REQUIRED. BDT-only benchmark limit (the limit the GNN must beat), on the same events as the GNN limit:
  # one cut or a list of cuts on bdt_ISO, each in (0, 1). A list runs a cut scan.
  bdt_score_cut: [0.98, 0.982, 0.984, 0.986, 0.988, 0.99, 0.992, 0.994, 0.996]   # scan 0.98 to 0.996, step 0.002
