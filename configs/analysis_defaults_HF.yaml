# Frozen analysis settings for the HF channel. Same values as analysis_defaults_W.yaml, except the models.
# NOT meant to be edited. Put your own settings in your user config (see example_HF.yaml).
# Paths are relative to the repository root.
# The channel is set once, in the user config (channel: HF selects this file).
# No frozen HF models yet: the bdt / gnn paths below do not exist. Set `models:` in the user
# config to an HF training gnn_vsN (its settings come from the training).

resonance_skim:                # stage 0, per tau candidate (raw NanoAOD); used if already_resonance_skimmed: false
  vtx_chi2_max: 20             # 3-muon vertex chi2 < vtx_chi2_max
  mass_range: [1.0, 3.0]       # GeV, low < m(3 mu) < high; m from the three muon 4-vectors
  veto_masses: [0.78266, 1.019461]  # GeV, omega(782), phi(1020) (PDG)
  veto_half_width: 0.040       # GeV, remove if an opposite-sign dimuon mass is within this of a veto mass
  pf_dr_max: 1.0               # keep PF candidates with DeltaR < pf_dr_max to any kept tau candidate (old skims: 1.0)

skim:                          # stage 1, values from tau3mu_gnn/utils/skimmer.py
  dz_max: 0.5                  # |dZ(mu_i, mu_j)| < dz_max for all three pairs
  cos_alpha_2d_min: 0.5        # CosAlpha2D_LxyP3mu > cos_alpha_2d_min

bdt:                           # stage 2, ISO BDT only
  classifier: models/HF/bdt/ISO_classifiers.pck   # placeholder, no frozen HF BDT

gnn:                           # stage 3, fixed model; its settings (conv type, graph type, BDT preselection
                               # cut, ...) are in <model_dir>/<model_name>/model_settings.json
  model_dir: models/HF/gnn     # files in <model_dir>/<model_name>/; placeholder
  model_name: no_frozen_HF_model

limit:                         # stage 5, mass fit + Combine
  tau_mass: 1.78               # GeV
  mass_window: 0.060           # GeV, half-width of the blinded signal window
  fit_range: [1.6, 2.0]        # GeV, mass range of the sideband fit and of the Combine workspace
  cl: 0.90                     # confidence level of the expected limit

slurm:                         # SLURM resources per job (PSI T3). Raise them here if jobs hit the limit.
  account: t3
  jobs:
    skim:           {partition: long,     mem: 256G, time: "1-00:00:00", cpus: 4}  # full raw W: 5 h, peak memory 128 GB
    bdt:            {partition: standard, mem: 128G, time: "0-06:00:00", cpus: 1}  # full W: peak memory 107 GiB
    gnn_signal:     {partition: long,     mem: 64G,  time: "1-00:00:00", cpus: 1}
    gnn_background: {partition: long,     mem: 128G, time: "2-00:00:00", cpus: 1}  # full W: needs more than 64 GB
    eval:           {partition: standard, mem: 32G,  time: "0-01:00:00", cpus: 1}
    limit:          {partition: standard, mem: 128G, time: "0-01:30:00", cpus: 1}
    summary:        {partition: short,    mem: 4G,   time: "0-00:30:00", cpus: 1}

htcondor:                      # HTCondor resources per job (lxplus): the SLURM values. time -> +MaxRuntime,
  jobs:                        # mem -> request_memory, disk -> request_disk. Optional per job: gpus, requirements, disk.
    skim:           {mem: 8G,  time: "0-08:00:00", cpus: 8, disk: 100G}  # measured (full W): peak 5.3 GB, 4.6 h, 6 cores, 81 GB disk
    bdt:            {mem: 4G,  time: "0-04:00:00", cpus: 1, disk: 50G}   # measured (full W): peak 2.7 GB, 2.2 h, 41 GB disk
    gnn_signal:     {mem: 10G, time: "1-00:00:00", cpus: 8, disk: 10G}   # measured (full W): peak 6.8 GB, 10.8 h, 8 cores, 4 GB disk
    gnn_background: {mem: 10G, time: "0-08:00:00", cpus: 8, disk: 50G}   # measured (full W): peak 7.0 GB, 3.8 h, 4 cores, 37 GB disk
    eval:           {mem: 2G,  time: "0-01:00:00", cpus: 1}              # measured (full W): peak 0.6 GB, 5 min
    limit:          {mem: 2G,  time: "0-01:00:00", cpus: 1}              # measured (full W): peak 1.0 GB, 21 min
    summary:        {mem: 1G,  time: "0-00:30:00", cpus: 1}              # measured (full W): peak 42 MB, < 1 min
