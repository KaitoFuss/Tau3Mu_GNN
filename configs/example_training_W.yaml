# Example training user config (W channel). Copy this file and edit it.
# Frozen training settings live in training_defaults_W.yaml, frozen analysis settings in
# analysis_defaults_W.yaml; neither may be set here.

training_name: my_W_train                  # letters, digits, _ - . only; used as folder name

channel: W                                 # selects configs/training_defaults_W.yaml + analysis_defaults_W.yaml

# Batch system: htcondor (default, lxplus). The paths below are lxplus paths.
# On the PSI T3: scheduler: slurm, with T3 paths (dCache output_base, log_dir on /work).
# scheduler: htcondor

paths:
  # All outputs go to <output_base>/<training_name>.
  # EOS user space ($USER_INITIAL = the first letter of $USER, e.g. /eos/user/k/kfuss).
  # Jobs write to their scratch folder first and then xrdcp to this location.
  output_base: root://eosuser.cern.ch//eos/user/$USER_INITIAL/$USER/tau3mu_pipeline/training
  # Folder on AFS for the job scripts and HTCondor logs (HTCondor cannot write its logs to EOS).
  # Logs are also copied next to the results (<phase>_vsN/logs/).
  log_dir: /afs/cern.ch/user/$USER_INITIAL/$USER/tau3mu_logs
  # Optional. Conda env that the jobs activate. Not set: the env that is active when you submit.
  # conda_env: /eos/user/$USER_INITIAL/$USER/envs/Tau3Mu

inputs:
  # Globs are allowed. A single path is also fine.
  # Riccardo's raw W NanoAOD (TauTo3Mu_*, PFCands_* branches, no Slimmed_*); copy of the T3 files
  # in the B-physics group space (jobs/migration/).
  signal:
    - /eos/cms/store/group/phys_bphys/kfuss/tau3mu_inputs/manzoni/tau3mu_gnn/WtoTauNu-Tauto3Mu_TuneCP5_13p6TeV_pythia8/05may25v2__WtoTauNu-Tauto3Mu_TuneCP5_13p6TeV_pythia8_RunIII2024Summer24MiniAOD-140X_mcRun3_2024_realistic_v26-v2_MINIAODSIM/250506_093818/*/*.root
  # All 8 ParkingDoubleMuonLowMass streams, Run2024B-I. Only the era folders (they start with "_"):
  # the 29apr2025 folders of streams 0-4 are older copies of eras B-E. The old skims used only
  # the era folders (checked: no event that is only in 29apr2025 is in the old skim).
  background:
    - /eos/cms/store/group/phys_bphys/kfuss/tau3mu_inputs/manzoni/tau3mu_gnn/ParkingDoubleMuonLowMass*/_ParkingDoubleMuonLowMass*_Run2024*/*/*/*.root
  tree_name: Events                        # optional, default: Events
  already_resonance_skimmed: false         # true: skip stage 0 (resonance skim); false: inputs are raw NanoAOD

# Map from the analysis branch names (left) to the names in YOUR ntuples (right).
# Only list branches whose name differs. Leave empty if your names are the same.
# Raw NanoAOD (already_resonance_skimmed: false): use the raw names on the left (TauTo3Mu_*, PFCands_*).
branch_map: {}
#   TauTo3Mu_fitted_pt: Tau3Mu_fit_pt

graphs:
  bdt_preselection_cut: 0.8                # REQUIRED. Only events with bdt_ISO >= cut go into the GNN training graphs
  # max_events: 600000                     # optional, default 600000; graphs per sample

# bdt_training:
#   max_events_per_class: 100000           # optional, default 100000; BDT training events per class
