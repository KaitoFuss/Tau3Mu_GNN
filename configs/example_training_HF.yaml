# Example training user config (HF channel). Copy this file and edit it.
# Frozen training settings live in training_defaults_HF.yaml, frozen analysis settings in
# analysis_defaults_HF.yaml; neither may be set here.

training_name: HF_training                 # letters, digits, _ - . only; used as folder name

channel: HF                                # selects configs/training_defaults_HF.yaml + analysis_defaults_HF.yaml

# Batch system: htcondor (default, lxplus). The paths below are lxplus paths.
# On the PSI T3: scheduler: slurm, with T3 paths (dCache output_base, log_dir on /work).
# scheduler: htcondor

paths:
  # All outputs go to <output_base>/<training_name>.
  # EOS user space ($USER_INITIAL = the first letter of $USER, e.g. /eos/user/k/kfuss).
  # Jobs write to their scratch folder first and then xrdcp to this location.
  output_base: root://eosuser.cern.ch//eos/user/$USER_INITIAL/$USER/tau3mu_pipeline/training
  # Folder on AFS for the job scripts and HTCondor logs (HTCondor cannot write its logs to EOS).
  # Logs are also copied next to the results (<phase>_vsN/logs/).
  log_dir: /afs/cern.ch/user/$USER_INITIAL/$USER/tau3mu_logs
  # Optional. Conda env that the jobs activate. Not set: the env that is active when you submit.
  # conda_env: /eos/user/$USER_INITIAL/$USER/envs/Tau3Mu

inputs:
  # Globs are allowed. A single path is also fine.
  # Kaito's old HF inputs: resonance-skimmed, before stage 1 (Slimmed_* branches, no Selected_*);
  # copy of the T3 files in Kaito's EOS space (step 14, jobs/migration/).
  # The background is in 4 parts; the glob takes all of them.
  signal:
    - /eos/user/k/kfuss/tau3mu_inputs/kfuss/tau3mu_gnn_round2/data/signal_HF/old_data/ds_large_signal_skimmed_no_resonances.root
  background:
    - /eos/user/k/kfuss/tau3mu_inputs/kfuss/tau3mu_gnn_round2/data/background_HF/old_data/data_skimmed_no_resonances_part*.root
  tree_name: Events                        # optional, default: Events
  already_resonance_skimmed: true          # true: skip stage 0 (resonance skim); false: inputs are raw NanoAOD

# Map from the analysis branch names (left) to the names in YOUR ntuples (right).
# Only list branches whose name differs. Leave empty if your names are the same.
# Raw NanoAOD (already_resonance_skimmed: false): use the raw names on the left (TauTo3Mu_*, PFCands_*).
branch_map: {}
#   Slimmed_TauTo3Mu_fitted_pt: Tau3Mu_fit_pt

graphs:
  bdt_preselection_cut: 0.8                # REQUIRED. Only events with bdt_ISO >= cut go into the GNN training graphs
  # max_events: 600000                     # optional, default 600000; graphs per sample

# bdt_training:
#   max_events_per_class: 100000           # optional, default 100000; BDT training events per class

benchmark:
  # REQUIRED. BDT-only benchmark limit: one cut or a list of cuts on bdt_ISO. A list runs a cut scan.
  bdt_score_cut: [0.88, 0.89, 0.90, 0.91, 0.92, 0.93, 0.94, 0.95, 0.96, 0.97]   # scan 0.88 to 0.97 (old HF best: 0.91)

limit:
  # REQUIRED. Weight that scales the signal MC to your dataset (lumi, cross section, reference BR).
  # 0.000152 is the old HF value for Kaito's old HF dataset; its origin is not known. Like the W value, it
  # only scales the signal to comparable limits for now (Kaito, 2026-10-30)
  # (spec docs/superpowers/specs/2026-10-25-step13-hf-design.md, sec. 2).
  signal_weight: 0.000152
