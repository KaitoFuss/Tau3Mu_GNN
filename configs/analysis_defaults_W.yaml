# Frozen analysis settings for the W channel.
# NOT meant to be edited. Put your own settings in your user config (see example_W.yaml).
# Paths are relative to the repository root.
# The channel is set once, in the user config (channel: W selects this file).

resonance_skim:                # stage 0, per tau candidate (raw NanoAOD); used if already_resonance_skimmed: false
  vtx_chi2_max: 20             # 3-muon vertex chi2 < vtx_chi2_max
  mass_range: [1.0, 3.0]       # GeV, low < m(3 mu) < high; m from the three muon 4-vectors
  veto_masses: [0.78266, 1.019461]  # GeV, omega(782), phi(1020) (PDG)
  veto_half_width: 0.040       # GeV, remove if an opposite-sign dimuon mass is within this of a veto mass
  pf_dr_max: 1.0               # keep PF candidates with DeltaR < pf_dr_max to any kept tau candidate (old skims: 1.0)

skim:                          # stage 1, values from tau3mu_gnn/utils/skimmer.py
  dz_max: 0.5                  # |dZ(mu_i, mu_j)| < dz_max for all three pairs
  cos_alpha_2d_min: 0.5        # CosAlpha2D_LxyP3mu > cos_alpha_2d_min

bdt:                           # stage 2, ISO BDT only
  classifier: models/W/bdt/ISO_classifiers_24feb2026_v0.pck

gnn:                           # stage 3, fixed model
  model_dir: models/W/gnn      # files in <model_dir>/<model_name>/
  model_name: new_hope_W_fl_8_sd_4_GINE_delete_muons_vs2
  conv_type: GINE
  gnn_mode: final_layer
  unsculpting_mode: delete_muons
  graph_type: skimmed_dzd0_cone_size_0.5_knn_10
  bdt_preselection_cut: 0.8    # run the GNN only on events with BDT ISO score > this

limit:                         # stage 5, mass fit + Combine
  tau_mass: 1.78               # GeV
  mass_window: 0.060           # GeV, half-width of the blinded signal window
  fit_range: [1.6, 2.0]        # GeV, mass range of the sideband fit and of the Combine workspace
  cl: 0.90                     # confidence level of the expected limit

slurm:                         # SLURM resources per job (step 9). Times: first values (Kaito, 2026-10-12);
  account: t3                  # raise them here if jobs hit the limit.
  jobs:
    skim:           {partition: long,     mem: 128G, time: "1-00:00:00", cpus: 4}  # raw W test: stage 0 ~5 s/file, full raw ~6300 files (2026-10-23)
    bdt:            {partition: standard, mem: 128G, time: "0-06:00:00", cpus: 1}  # full W: MaxRSS 107 GiB (job 202616)
    gnn_signal:     {partition: long,     mem: 64G,  time: "1-00:00:00", cpus: 1}
    gnn_background: {partition: long,     mem: 128G, time: "2-00:00:00", cpus: 1}  # full W: MaxRSS 64 GB = old limit (job 205117)
    eval:           {partition: standard, mem: 32G,  time: "0-01:00:00", cpus: 1}
    limit:          {partition: standard, mem: 128G, time: "0-01:30:00", cpus: 1}
    summary:        {partition: short,    mem: 4G,   time: "0-00:30:00", cpus: 1}
